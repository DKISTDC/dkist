%YAML 1.1
---
$schema: "http://stsci.edu/schemas/yaml-schema/draft-01"
id: "asdf://dkist.nso.edu/schemas/dataset_extra-1.0.0"

title: Dataset Extra
description: A representation of the headers and arrays for a single dataset extra.

type: object
properties:
  name:
    type: string
    description: Dataset extra name
  full_header_table:
    tag: "tag:astropy.org:astropy/table/table-1.*"
    description: Table of all headers for the extra, or all extras in a dataset.
  header_rows:
    description: Rows in full_header_table which correspond to this extra, if missing, all rows are used.
    type: array
    items:
      type: integer
  files:
    type: array
    items:
      tag: "tag:stsci.edu:asdf/core/externalarray-1.0.0"

required: [name, full_header_table, files]
additionalProperties: false
...
